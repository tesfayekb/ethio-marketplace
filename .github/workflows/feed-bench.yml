name: Feed bench

# D101 §5 / DEC-166 — the feed engine's speed judge on ethio-staging:
# 100,500 scratch listings, six page shapes timed inside the database
# (feed_bench), everything removed after. Weekly (Sunday 13:10 UTC, DEC-412 —
# at least two hours before the earlier nightly cron, 15:30 UTC; was 16:10 UTC,
# DEC-171, and 05:10 UTC, DEC-167)
# and on demand; red when a target is missed, or when it was skipped or
# yielded to another staging run (DEC-168, scripts/staging-gate.ts).
# Evidence publishes to branch ci-evidence (DEC-098).
# The quiet window (the tests and CI turn 2, ruling 4): a run yields to every CI, Nightly E2E or
# Guard Proof run from the moment that run is queued. Those are started by a push to a branch with
# an open pull request into dev (a docs-only push too), a merge into dev, a pull request opened,
# the nightly crons (15:30 and 16:30 UTC) and a Guard Proof dispatch. Dispatch only when no such run
# is queued or in progress, and let nothing of that kind happen until the run completes. The window
# is the gate's wait plus about 25 minutes (run 44896403216: 1,513 s from start to end, 2 s of it
# the gate's). The job's limit is the gate's whole wait, plus half as much again of the measured
# run: 40 + 38 = 78 minutes (INC-1230), so every honest end is the script's own; only a hang meets
# it. 13:10 UTC plus 78 minutes ends before the nightly's 15:30 UTC.
on:
  schedule:
    - cron: "10 13 * * 0"
  workflow_dispatch:

# DEC-153 (a) — read-only by default; only the job that publishes holds write.
permissions:
  contents: read

concurrency:
  group: feed-bench
  cancel-in-progress: false

jobs:
  feed-bench:
    name: Feed bench (ethio-staging, 100,500 scratch listings)
    runs-on: ubuntu-24.04
    # DEC-412, INC-1230 — the gate's whole wait, plus half as much again of the measured run:
    # GATE_WAIT_MINUTES 40 + RUN_ALLOWANCE_MINUTES 38 (scripts/feed-bench.ts; CF-CID-11). Run
    # 44896403216 (2026-11-21, 2,048 sellers) measured: gate 2 s, seed 1,330 s, pre-clean and
    # measure 7 s, cleanup 157 s, the other steps 17 s; without the gate 1,511 s, half as much
    # again 37.8 min. Was 60, from run 43872334867's 2,373 s with 256 sellers and its gate in it.
    timeout-minutes: 78
    permissions:
      contents: write
      # DEC-168 — the staging gate reads the repository's runs.
      actions: read
    env:
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        timeout-minutes: 12
        run: bash scripts/ci/with-deadline.sh 300 2 -- bun install --frozen-lockfile
      - name: Run the bench
        id: bench
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/feed-bench.ts
      - name: Publish the status to ci-evidence
        if: always()
        env:
          # DEC-321 — the ref this run tested; the publisher files a non-dev ref's evidence under branches/<ref>/.
          EVIDENCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ ! -f docs/tracking/feed-bench-status.md ]; then
            mkdir -p docs/tracking
            {
              echo "# Feed bench (auto-generated — do not edit by hand)"
              echo
              echo "- Run: ${RUN_URL}"
              echo "- Commit: ${RUN_SHA}"
              echo "- Verdict: FAILED (the script wrote no status file)"
            } > docs/tracking/feed-bench-status.md
          fi
          bash scripts/publish-evidence.sh "chore(ci): feed bench status [skip ci]" \
            docs/tracking/feed-bench-status.md
      - name: Report the verdict
        if: always()
        env:
          OUTCOME: ${{ steps.bench.outcome }}
        run: |
          if [ "${OUTCOME}" != "success" ]; then
            echo "::error::Feed bench: a target was missed or the run failed (docs/tracking/feed-bench-status.md on ci-evidence)."
            exit 1
          fi
          echo "Feed bench passed."
