name: P1-g probe (census 2/3 — recovery vs email identity)

# Manual only. Mints ONE throwaway user in the reserved '@ethio-e2e.invalid'
# namespace on ethio-staging, probes password recovery for a google-only-shaped
# account, prints the labelled evidence blocks, and always tears the user down.
#
# Requires (in addition to the E2E job's existing env): a secret
# E2E_SUPABASE_DB_URL — the ethio-staging Postgres connection string. It is
# needed because the google-only shape (synthetic google identity + email
# identity DELETE) cannot be produced through the GoTrue admin API.
on:
  workflow_dispatch:

jobs:
  probe:
    name: Recovery identity probe (ethio-staging)
    runs-on: ubuntu-latest
    env:
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preflight (no secret values are printed)
        run: |
          echo "target = $E2E_SUPABASE_URL"
          echo "service-role key present = ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "db url present = ${{ secrets.E2E_SUPABASE_DB_URL != '' }}"

      - name: Phase 1 — mint the probe user and emit the shape SQL
        run: bun run scripts/deny-tests/p1g-recovery-identity.ts --phase 1

      - name: Apply the shape SQL (synthetic google identity + email identity DELETE)
        run: |
          echo "--- shape SQL (throwaway user only) ---"
          cat /tmp/p1g-shape.sql
          psql "$E2E_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/p1g-shape.sql

      - name: Phase 2 — census 2/3 probe and VERDICT read-back
        id: verdict
        continue-on-error: true
        run: bun run scripts/deny-tests/p1g-recovery-identity.ts --phase 2

      - name: Phase 3 — teardown (always)
        if: always()
        run: bun run scripts/deny-tests/p1g-recovery-identity.ts --phase 3

      - name: Report the probe outcome
        if: always()
        run: |
          echo "phase 2 outcome = ${{ steps.verdict.outcome }}"
          echo "Read the VERDICT line in the 'Phase 2' step log and paste it into the P1-g report."
