name: Local backend proof

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: local-backend-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    name: Smoke on temporary Supabase (non-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub permissions are job-scoped; only the publish step receives this
    # token. Checkout deliberately persists no write credential.
    permissions:
      contents: write
    env:
      SUPABASE_PROJECT_ID: ethio-ci-local
      E2E_LOCAL_BACKEND: "1"
      E2E_SHARD: localproof
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "1"
      E2E_FAKE_TRANSLATE: "1"
      E2E_FAKE_GEOCODE: "1"
    steps:
      - name: Begin proof clock
        run: |
          echo "PROOF_BEGIN=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record checkout seconds
        run: echo "CHECKOUT_SECONDS=$(( $(date +%s) - PROOF_BEGIN ))" >> "$GITHUB_ENV"
      - name: Begin install clock
        run: echo "INSTALL_BEGIN=$(date +%s)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Record install seconds
        if: always()
        run: echo "INSTALL_SECONDS=$(( $(date +%s) - INSTALL_BEGIN ))" >> "$GITHUB_ENV"
      - name: Begin CLI clock
        run: echo "CLI_BEGIN=$(date +%s)" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0
      - name: Record CLI seconds
        if: always()
        run: echo "CLI_SECONDS=$(( $(date +%s) - CLI_BEGIN ))" >> "$GITHUB_ENV"
      - name: Prepare temporary working copy
        run: |
          begin=$(date +%s)
          mkdir -p .ci-local/supabase/migrations
          cp supabase/migrations/*.sql .ci-local/supabase/migrations/
          cat > .ci-local/supabase/migrations/00000000000000_ci_local_buckets.sql <<'SQL'
          -- Census c1/c2: buckets are operator-created on hosted staging.
          INSERT INTO storage.buckets (id, name, public)
          VALUES ('category-assets', 'category-assets', true),
                 ('listing-photos', 'listing-photos', false)
          ON CONFLICT DO NOTHING;
          SQL
          # D228 turn 14b: the working copy's named fixes (DEC-209: in the proof's working copy, never in a landed migration).
          wc=.ci-local/supabase/migrations
          : > local-backend-working-copy.txt
          # (1) Never applied on hosted (INC-266): its own proof asserted 'update'; 20260922121913 restates it.
          rm "$wc/20260922120000_a4e1c9d2-7b5f-4c86-9a30-6d2f81ce4b77.sql"
          echo "- skipped 20260922120000: never applied on hosted (INC-266); 20260922121913 restates it" >> local-backend-working-copy.txt
          patch_copy() {
            before=$(sha256sum "$wc/$1" | cut -c1-12)
            sed -i "$2" "$wc/$1"
            after=$(sha256sum "$wc/$1" | cut -c1-12)
            if [ "$before" = "$after" ]; then echo "::error::working-copy patch changed nothing: $1"; exit 1; fi
            echo "- patched ${1%%_*} ($before -> $after): $3" >> local-backend-working-copy.txt
          }
          # (2) A privilege check by NAME over pg_class is evaluated before its namespace filter on a small catalogue ("relation public.buckets does not exist"); the table's oid names the same table.
          patch_copy 20260830091427_f1d6873d-acd2-480f-89c3-36f0f786c0a3.sql "s/format('public.%I', c.relname)/c.oid/g" "the service_role proof checks each table by oid"
          patch_copy 20260830091455_14223614-1c76-4cad-97f2-f455e485cbc3.sql "s/format('public.%I', c.relname)/c.oid/g" "the service_role census checks each table by oid"
          # (3) PROOF 5 measured the real catalogue's answer size on hosted (at most 8 rows and 2,048 bytes); the migrations' own catalogue answers 2,111 bytes.
          patch_copy 20260924084437_231d2821-bdd1-4447-996a-60cfc3009497.sql "s/RAISE EXCEPTION 'PROOF 5 failed'/RAISE WARNING 'PROOF 5 (the real catalogue size, proven on hosted): % bytes', v_bytes/" "PROOF 5 reports the size instead of refusing"
          fixture() {
            echo "- fixture $1: $2" >> local-backend-working-copy.txt
          }
          # (4) What a hosted project has before its first migration.
          cat > "$wc/00000000000001_ci_local_hosted_platform.sql" <<'SQL'
          -- D228 turn 14b: what a hosted project has before its first migration.
          -- (a) Public objects are born without grants to the browser roles: 20260810075629's P5 ("home_country_code update was permitted") passed on hosted only because authenticated held no table-wide UPDATE on profiles.
          ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON SEQUENCES FROM anon, authenticated;
          -- (b) The platform's row-level-security event trigger, read from ethio-prod (census rows j and k).
          CREATE OR REPLACE FUNCTION public.rls_auto_enable()
           RETURNS event_trigger
           LANGUAGE plpgsql
           SECURITY DEFINER
           SET search_path TO 'pg_catalog'
          AS $function$
          DECLARE
            cmd record;
          BEGIN
            FOR cmd IN
              SELECT *
              FROM pg_event_trigger_ddl_commands()
              WHERE command_tag IN ('CREATE TABLE', 'CREATE TABLE AS', 'SELECT INTO')
                AND object_type IN ('table','partitioned table')
            LOOP
               IF cmd.schema_name IS NOT NULL AND cmd.schema_name IN ('public') AND cmd.schema_name NOT IN ('pg_catalog','information_schema') AND cmd.schema_name NOT LIKE 'pg_toast%' AND cmd.schema_name NOT LIKE 'pg_temp%' THEN
                BEGIN
                  EXECUTE format('alter table if exists %s enable row level security', cmd.object_identity);
                  RAISE LOG 'rls_auto_enable: enabled RLS on %', cmd.object_identity;
                EXCEPTION
                  WHEN OTHERS THEN
                    RAISE LOG 'rls_auto_enable: failed to enable RLS on %', cmd.object_identity;
                END;
               ELSE
                  RAISE LOG 'rls_auto_enable: skip % (either system schema or not in enforced list: %.)', cmd.object_identity, cmd.schema_name;
               END IF;
            END LOOP;
          END;
          $function$
          ;
          CREATE EVENT TRIGGER ensure_rls ON ddl_command_end WHEN TAG IN ('CREATE TABLE', 'CREATE TABLE AS', 'SELECT INTO') EXECUTE FUNCTION public.rls_auto_enable();
          SQL
          fixture 00000000000001 "hosted defaults: no browser-role default grants; the platform's RLS event trigger (needed by 20260911223744 and by every table created without its own ENABLE ROW LEVEL SECURITY)"
          # (5) The accounts hosted had when the bootstrap and the early proofs ran: the bootstrap account (read from its landed migrations, never printed) and three plain ones. No password; never signed in.
          cat > "$wc/20260809010129_ci_local_accounts.sql" <<'SQL'
          -- D228 turn 14b: accounts for 20260809010130 (bootstrap), 20260809103904 (a base user), 20260817061418 (one more profile) and 20260917210349 / 20260917210459 (the super admin by id).
          INSERT INTO auth.users (instance_id, id, aud, role, email, created_at, updated_at, raw_app_meta_data, raw_user_meta_data)
          VALUES ('00000000-0000-0000-0000-000000000000', '__BOOTSTRAP_ID__', 'authenticated', 'authenticated', '__BOOTSTRAP_EMAIL__', now(), now(), '{}'::jsonb, '{}'::jsonb);
          INSERT INTO auth.users (instance_id, id, aud, role, email, created_at, updated_at, raw_app_meta_data, raw_user_meta_data)
          SELECT '00000000-0000-0000-0000-000000000000', gen_random_uuid(), 'authenticated', 'authenticated', e, now(), now(), '{}'::jsonb, '{}'::jsonb
          FROM unnest(ARRAY['ci-local-1@example.invalid', 'ci-local-2@example.invalid', 'ci-local-3@example.invalid']) AS e;
          SQL
          bootstrap_email=$(grep -o "auth.users WHERE email = '[^']*'" supabase/migrations/20260809010130_05add65c-4963-4df2-95bd-b1cc855820c0.sql | head -1 | sed "s/.*= '//; s/'\$//")
          bootstrap_id=$(grep -o "v_uid   uuid := '[0-9a-f-]*'" supabase/migrations/20260917210349_c23b6c76-b29b-4cfe-b559-0d4abc728a9f.sql | head -1 | sed "s/.*:= '//; s/'\$//")
          if [ -z "$bootstrap_email" ] || [ -z "$bootstrap_id" ]; then echo "::error::the bootstrap account was not found in its landed migrations"; exit 1; fi
          sed -i "s/__BOOTSTRAP_EMAIL__/$bootstrap_email/; s/__BOOTSTRAP_ID__/$bootstrap_id/" "$wc/20260809010129_ci_local_accounts.sql"
          fixture 20260809010129 "four accounts: the bootstrap account by its landed e-mail and id, and three plain ones (ci-local-N@example.invalid)"
          # (6) The open countries' currencies (set on hosted through the admin): 20260917112956's P5b defaults ET's.
          cat > "$wc/20260917112955_ci_local_country_currencies.sql" <<'SQL'
          -- D228 turn 14b: 20260917112956's P5b reads ET's currency ("refusals: price_currency required" without it).
          UPDATE public.countries c SET currency_code = v.cur
          FROM (VALUES ('ET', 'ETB'), ('US', 'USD'), ('GB', 'GBP'), ('DE', 'EUR'), ('KE', 'KES'), ('CA', 'CAD')) AS v(code, cur)
          WHERE c.code = v.code AND c.currency_code IS NULL;
          SQL
          fixture 20260917112955 "the currencies of ET, US, GB, DE, KE and CA (ISO 4217), which no migration sets"
          # (7) The catalogue's 'voltage' definition (imported on hosted): 20260921092130's proofs round-trip it.
          cat > "$wc/20260921092129_ci_local_voltage.sql" <<'SQL'
          -- D228 turn 14b: 20260921092130's proofs read the 'voltage' definition ("PROOF setup: voltage definition absent" without it).
          INSERT INTO public.attributes (attr_key, name_en, attr_type, options)
          VALUES ('voltage', 'Voltage', 'single_select',
                  '[{"value":"220v","label_en":"220 V"},{"value":"110v","label_en":"110 V"},{"value":"380v_three_phase","label_en":"380 V three-phase"}]'::jsonb);
          SQL
          fixture 20260921092129 "a 'voltage' definition with the three digit-led values the proof names"
          # (8) A home country for the plain accounts: 20260927045940's proof borrows the oldest active account with one.
          cat > "$wc/20260927045939_ci_local_residency.sql" <<'SQL'
          -- D228 turn 14b: 20260927045940's proof needs an active account with a home country ("no active seller" without it).
          UPDATE public.user_directory d SET home_country_code = 'ET', country_source = 'user_confirmed'
            FROM auth.users u WHERE u.id = d.user_id AND u.email LIKE 'ci-local-%@example.invalid';
          UPDATE public.profiles p SET home_country_code = 'ET', country_source = 'user_confirmed'
            FROM auth.users u WHERE u.id = p.user_id AND u.email LIKE 'ci-local-%@example.invalid';
          SQL
          fixture 20260927045939 "home country ET for the three plain accounts"
          # (9) One active sub-city (hosted's came from the places import): 20260929201601's proof needs one.
          cat > "$wc/20260929201600_ci_local_sub_city.sql" <<'SQL'
          -- D228 turn 14b: 20260929201601's proof needs an active sub-city ("PROOF setup failed: places" without it).
          INSERT INTO public.locations (parent_id, level, country_code, name_en, slug, is_active, region_id, city_id, center_lat, center_lng)
          SELECT c.id, 'sub_city', c.country_code, 'Bole', 'bole', true, c.region_id, c.id, 8.9906, 38.7893
            FROM public.locations c WHERE c.level = 'city' AND c.slug = 'addis-ababa';
          SQL
          fixture 20260929201600 "the sub-city Bole under Addis Ababa"
          cat > .ci-local/supabase/config.toml <<'TOML'
          # D228 phase 1 — the temporary backend's config (CI only; the repository's supabase/config.toml is the platform's).
          project_id = "ethio-ci-local"

          [api]
          enabled = true
          port = 54321
          schemas = ["public", "graphql_public"]
          extra_search_path = ["public", "extensions"]
          max_rows = 1000

          [db]
          port = 54322
          shadow_port = 54320
          major_version = 17

          [db.seed]
          enabled = false

          [realtime]
          enabled = false

          [studio]
          enabled = false

          [inbucket]
          enabled = true
          port = 54324

          [storage]
          enabled = true
          file_size_limit = "50MiB"

          [auth]
          enabled = true
          site_url = "http://127.0.0.1:4173"
          additional_redirect_urls = ["http://127.0.0.1:4173/**", "http://localhost:4173/**"]
          jwt_expiry = 3600
          enable_refresh_token_rotation = true
          enable_signup = true
          minimum_password_length = 8

          [auth.email]
          enable_signup = true
          double_confirm_changes = true
          enable_confirmations = false

          [auth.mfa]
          max_enrolled_factors = 10

          [auth.mfa.totp]
          enroll_enabled = true
          verify_enabled = true

          [auth.hook.before_user_created]
          enabled = true
          uri = "pg-functions://postgres/public/hook_before_user_created"

          [edge_runtime]
          enabled = false

          [analytics]
          enabled = false
          TOML
          echo "PREPARE_SECONDS=$(( $(date +%s) - begin ))" >> "$GITHUB_ENV"
      - name: Start backend and apply all migrations
        id: backend
        run: |
          begin=$(date +%s)
          set +e
          supabase start --workdir .ci-local -x realtime,studio,imgproxy,vector,logflare,edge-runtime,postgres-meta,supavisor > local-backend-start.log 2>&1
          result=$?
          set -e
          echo "START_SECONDS=$(( $(date +%s) - begin ))" >> "$GITHUB_ENV"
          echo "START_EXIT=$result" >> "$GITHUB_ENV"
          : > local-backend-failure.txt
          if [ "$result" -ne 0 ]; then
            # Raw log is never printed: the evidence step redacts credentials.
            exit "$result"
          fi
          set +e
          supabase status --workdir .ci-local -o env > "$RUNNER_TEMP/local-backend.env" 2> "$RUNNER_TEMP/local-backend-status.err"
          status_result=$?
          set -e
          if [ "$status_result" -ne 0 ]; then
            python3 - "$status_result" <<'PY'
          import os, re, sys
          from pathlib import Path
          err = Path(os.environ['RUNNER_TEMP'], 'local-backend-status.err').read_text(errors='replace')
          err = re.sub(r'\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b', '[masked JWT]', err)
          err = re.sub(r'\bsb_(?:secret|publishable)_[A-Za-z0-9_-]+\b', '[masked key]', err)
          err = re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[e-mail]', err)
          err = re.sub(r'(│\s*(?:Access Key|Secret Key)\s*│\s*)[^│]*?(\s*│)', r'\1[masked]\2', err)
          err = re.sub(r'[0-9a-fA-F]{32,}', '[masked hex]', err)
          err = ' '.join(err.split())[:300]
          with open('local-backend-failure.txt', 'a') as out:
              out.write('status: exit ' + sys.argv[1] + ' ' + err + '\n')
          PY
            exit "$status_result"
          fi
          # Never eval the CLI output. Parse NAME=value lines; accept either key-name pair.
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          def fail(message):
              with open('local-backend-failure.txt', 'a') as out:
                  out.write('status parse: ' + message + '\n')
              raise SystemExit(message)
          values = {}
          for line in Path(os.environ['RUNNER_TEMP'], 'local-backend.env').read_text().splitlines():
              match = re.fullmatch(r'([A-Z0-9_]+)="?([^"\n]*)"?', line)
              if match:
                  values[match[1]] = match[2]
          if values.get('API_URL') != 'http://127.0.0.1:54321':
              fail('CLI status did not report exact local API URL')
          browser = 'ANON_KEY' if values.get('ANON_KEY') else 'PUBLISHABLE_KEY'
          server = 'SERVICE_ROLE_KEY' if values.get('SERVICE_ROLE_KEY') else 'SECRET_KEY'
          if not values.get(browser):
              fail('CLI status printed neither ANON_KEY nor PUBLISHABLE_KEY')
          if not values.get(server):
              fail('CLI status printed neither SERVICE_ROLE_KEY nor SECRET_KEY')
          print('::add-mask::' + values[browser])
          print('::add-mask::' + values[server])
          with open('local-backend-status.txt', 'w') as out:
              out.write('Status variables: ' + ', '.join(sorted(values)) + '\n')
              out.write('Keys used: ' + browser + ', ' + server + '\n')
          aliases = {
              'API_URL': ['E2E_SUPABASE_URL', 'VITE_SUPABASE_URL', 'SUPABASE_URL'],
              browser: ['E2E_SUPABASE_PUBLISHABLE_KEY', 'VITE_SUPABASE_PUBLISHABLE_KEY', 'SUPABASE_PUBLISHABLE_KEY'],
              server: ['E2E_SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_SERVICE_ROLE_KEY'],
          }
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, targets in aliases.items():
                  for target in targets:
                      output.write(target + '=' + values[name] + '\n')
          Path(os.environ['RUNNER_TEMP'], 'local-backend.env').unlink()
          PY
          # Discover the CLI's database container rather than assuming its name.
          running_containers=$(docker ps --format '{{.Names}}')
          database_containers=()
          while IFS= read -r name; do
            if [[ "$name" == supabase_db_* ]]; then
              database_containers+=("$name")
            fi
          done <<< "$running_containers"
          if [ "${#database_containers[@]}" -ne 1 ]; then
            container_names=$(printf '%s\n' "$running_containers" | paste -sd ',' -)
            echo "container: found ${#database_containers[@]} supabase_db_ containers among: $container_names" >> local-backend-failure.txt
            exit 1
          fi
          export DATABASE_CONTAINER="${database_containers[0]}"
          echo "Database container: $DATABASE_CONTAINER" >> local-backend-status.txt
          # Verify every repository migration version against the local ledger.
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import os
          def fail(message):
              with open('local-backend-failure.txt', 'a') as out:
                  out.write('ledger check: ' + message + '\n')
              raise SystemExit(message)
          command = ['docker', 'exec', os.environ['DATABASE_CONTAINER'], 'psql', '-U', 'postgres', '-d', 'postgres', '-Atc', 'select version from supabase_migrations.schema_migrations order by version']
          result = subprocess.run(command, capture_output=True, text=True)
          if result.returncode != 0:
              fail('docker exec exit ' + str(result.returncode) + ': ' + result.stderr[:300])
          applied = set(result.stdout.splitlines())
          expected = {p.name.split('_', 1)[0] for p in Path('supabase/migrations').glob('*.sql')} - {'20260922120000'}
          expected |= {p.name.split('_', 1)[0] for p in Path('.ci-local/supabase/migrations').glob('*_ci_local_*.sql')}
          missing = sorted(expected - applied)
          Path('local-backend-migrations.txt').write_text('applied ' + str(len(expected)) + '/' + str(len(expected)) if not missing else 'missing: ' + ', '.join(missing))
          if missing:
              fail('repository migration versions missing from local ledger: ' + ', '.join(missing))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('MIGRATIONS_OK=1\n')
          PY
          # Local twins of the hosted default-grant and RLS census.
          set +e
          docker exec "$DATABASE_CONTAINER" psql -U postgres -d postgres -Atc "select 'RLS on ' || count(*) filter (where relrowsecurity) || ' of ' || count(*) || ' public tables' from pg_class where relnamespace = 'public'::regnamespace and relkind in ('r', 'p');" > local-backend-parity.txt 2> "$RUNNER_TEMP/parity.err"
          parity_result=$?
          set -e
          if [ "$parity_result" -ne 0 ]; then
            echo "parity: exit $parity_result" >> local-backend-failure.txt
            exit "$parity_result"
          fi
          set +e
          docker exec "$DATABASE_CONTAINER" psql -U postgres -d postgres -Atc "select 'Default grants in public: ' || coalesce(string_agg(role || ' | ' || defaclobjtype || ' | ' || defaclacl, '; ' order by role, defaclobjtype), 'none') from (select pg_get_userbyid(defaclrole) as role, defaclobjtype::text, defaclacl::text from pg_default_acl where defaclnamespace = 'public'::regnamespace) as grants;" >> local-backend-parity.txt 2>> "$RUNNER_TEMP/parity.err"
          parity_result=$?
          set -e
          if [ "$parity_result" -ne 0 ]; then
            echo "parity: exit $parity_result" >> local-backend-failure.txt
            exit "$parity_result"
          fi
      - name: Build E2E app against local backend
        id: build
        run: |
          begin=$(date +%s)
          set +e
          bun run build:e2e
          result=$?
          set -e
          echo "BUILD_SECONDS=$(( $(date +%s) - begin ))" >> "$GITHUB_ENV"
          exit "$result"
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Begin browser clock
        run: echo "BROWSER_BEGIN=$(date +%s)" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Record browser seconds
        if: always()
        run: |
          if [ -n "${BROWSER_BEGIN:-}" ]; then
            echo "BROWSER_SECONDS=$(( $(date +%s) - BROWSER_BEGIN ))" >> "$GITHUB_ENV"
          fi
      - name: Smoke tier (same files and projects as CI)
        id: smoke
        run: |
          begin=$(date +%s)
          set +e
          set -o pipefail
          bunx playwright test --project=mobile-360 --project=desktop-1280 --grep-invert "@global-state" e2e/smoke-auth-i18n.spec.ts e2e/shell.spec.ts e2e/auth-signout.spec.ts e2e/a11y.spec.ts 2>&1 | tee local-backend-smoke.log
          result=$?
          set -e
          echo "TEST_SECONDS=$(( $(date +%s) - begin ))" >> "$GITHUB_ENV"
          exit "$result"
      - name: Write proof evidence and notice
        if: always()
        env:
          PROOF_STATUS: ${{ job.status }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          def redact(text):
              for key in ('E2E_SUPABASE_PUBLISHABLE_KEY', 'E2E_SUPABASE_SERVICE_ROLE_KEY'):
                  value = os.environ.get(key)
                  if value:
                      text = text.replace(value, '[masked]')
              text = re.sub(r'\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b', '[masked JWT]', text)
              text = re.sub(r'\bsb_(?:secret|publishable)_[A-Za-z0-9_-]+\b', '[masked key]', text)
              text = re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[e-mail]', text)
              text = re.sub(r'(│\s*(?:Access Key|Secret Key)\s*│\s*)[^│]*?(\s*│)', r'\1[masked]\2', text)
              text = re.sub(r'[0-9a-fA-F]{32,}', lambda match: match[0] if match[0] == os.environ['GITHUB_SHA'] else '[masked hex]', text)
              return text
          env = os.environ
          lines = ['# Local backend proof (non-gating)', '', '- Commit: `' + env['GITHUB_SHA'] + '`', '- Run: https://github.com/' + env['GITHUB_REPOSITORY'] + '/actions/runs/' + env['GITHUB_RUN_ID'], '- CLI version: 2.120.0']
          for label, key in [('checkout', 'CHECKOUT_SECONDS'), ('install', 'INSTALL_SECONDS'), ('CLI install', 'CLI_SECONDS'), ('working copy', 'PREPARE_SECONDS'), ('start (migrations included)', 'START_SECONDS'), ('build', 'BUILD_SECONDS'), ('browser install', 'BROWSER_SECONDS'), ('tests', 'TEST_SECONDS')]:
              lines.append('- Seconds — ' + label + ': ' + env.get(key, 'not run'))
          ok = env.get('MIGRATIONS_OK') == '1'
          migrations = Path('local-backend-migrations.txt')
          lines.append('- Migrations: ' + (migrations.read_text() if migrations.exists() else 'not confirmed; backend ' + env.get('BACKEND_OUTCOME', 'not run')))
          working_copy = Path('local-backend-working-copy.txt')
          parity = Path('local-backend-parity.txt')
          working_lines = working_copy.read_text().splitlines() if working_copy.exists() else ['not written']
          lines += ['- Working copy:', *working_lines, '- Parity:', *(parity.read_text().splitlines() if parity.exists() else ['not written'])]
          status_file = Path('local-backend-status.txt')
          failure_file = Path('local-backend-failure.txt')
          status_lines = status_file.read_text().splitlines() if status_file.exists() else ['not written']
          failure_lines = failure_file.read_text().splitlines() if failure_file.exists() else ['not written']
          lines += ['- Status:', *[redact(line) for line in status_lines], '- Step failure:', *[redact(line) for line in failure_lines]]
          fixture_count = sum(line.startswith('- fixture ') for line in working_lines)
          start_log = Path('local-backend-start.log')
          if not ok and start_log.exists():
              text = redact(start_log.read_text(errors='replace'))
              applied_lines = [line for line in text.splitlines() if 'Applying migration' in line]
              lines += ['', '## Migration/start failure', 'Last migration line: ' + (applied_lines[-1] if applied_lines else 'no migration reached'), '```text', *text.splitlines()[-60:], '```']
          counts = {'passed': 0, 'failed': 0, 'flaky': 0, 'skipped': 0}
          failures = []
          results = Path('test-results/results.json')
          if results.exists():
              try:
                  data = json.loads(results.read_text())
                  def walk(suite, parents):
                      context = parents + ([suite.get('title', '')] if suite.get('title') else [])
                      for spec in suite.get('specs', []):
                          for test in spec.get('tests', []):
                              status = test.get('status')
                              category = {'expected': 'passed', 'unexpected': 'failed', 'flaky': 'flaky', 'skipped': 'skipped'}.get(status, 'failed')
                              counts[category] += 1
                              if category in ('failed', 'flaky'):
                                  errors = [e.get('message', str(e)) for attempt in test.get('results', []) for e in attempt.get('errors', [])]
                                  first = next((line for error in errors for line in error.splitlines() if line.strip()), 'no error message')
                                  failures.append(' / '.join(context + [spec.get('title', ''), test.get('projectName', '')]) + ' — ' + first)
                      for child in suite.get('suites', []):
                          walk(child, context)
                  for suite in data.get('suites', []):
                      walk(suite, [])
                  for error in data.get('errors', []):
                      failures.append('Outside test — ' + str(error.get('message', error)).splitlines()[0])
              except (ValueError, KeyError, TypeError) as error:
                  failures.append('Results could not be parsed: ' + str(error))
          else:
              failures.append('No JSON results; smoke ' + env.get('SMOKE_OUTCOME', 'not run'))
          total = sum(counts.values())
          lines.append('- Smoke: ' + ' · '.join(str(n) + ' ' + k for k, n in counts.items()) + ' · total ' + str(total))
          lines += ['- Job conclusion before evidence publication: ' + env.get('PROOF_STATUS', 'unknown'), '- Backend/build/smoke: ' + '/'.join(env.get(k, 'not run') for k in ('BACKEND_OUTCOME', 'BUILD_OUTCOME', 'SMOKE_OUTCOME'))]
          if failures:
              lines += ['', '## Failing/flaky tests and setup errors', *['- ' + redact(f) for f in failures]]
          lines += ['', 'DEC-209: compare with staging CI on this same commit; two consecutive dev proofs required. No automatic proceed verdict.']
          Path('docs/tracking/local-backend-proof.md').write_text(redact('\n'.join(lines)) + '\n')
          print('::notice title=local-backend-proof::start=' + env.get('START_SECONDS', 'not run') + 's; migrations=' + ('ok' if ok else 'failed/not confirmed') + '; smoke=' + str(counts['passed']) + '/' + str(total) + '; fixtures ' + str(fixture_count))
          PY
      - name: Keep smoke JSON and proof evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-backend-proof
          path: |
            test-results/results.json
            docs/tracking/local-backend-proof.md
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
      - name: Publish only proof evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No write credential is persisted by checkout or exposed to tests.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          bash scripts/publish-evidence.sh "local backend proof ${GITHUB_SHA:0:8}" docs/tracking/local-backend-proof.md
      - name: Dispose temporary backend
        if: always()
        run: |
          if command -v supabase >/dev/null && [ -f .ci-local/supabase/config.toml ]; then
            supabase stop --workdir .ci-local --no-backup > /dev/null 2>&1 || echo "::warning::local backend stop failed; runner disposal removes it"
          fi
