name: Guard Proof

# Proves that the B-3 and C-4 E2E guards FAIL when their guarded behaviour is broken
# (§8 proven-guard rule). Mutations live as inert .patch files and are applied only to
# the runner's working tree — never committed. See docs/features/guard-proof.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-proof:
    name: Guard proof (mutation fixtures, ethio-staging)
    runs-on: ubuntu-latest
    env:
      # ethio-staging — publishable values only; the service-role key is a secret.
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # INC-021: each guard is proven in BOTH directions (A/B), and the judge is
      # always Playwright's JSON reporter — never the process exit code, which
      # cannot tell a real test failure from a broken command.
      #
      # `|| true` on the playwright call is CORRECT here and ONLY here: the exit
      # code is deliberately ignored because the JSON assertion is the judge. It
      # is not swallowing a failure — assert-playwright-result.mjs fails the step.
      #
      # A failing `git apply` is information, not noise: the source moved and the
      # fixture is stale. It keeps `set -e` and fails loudly.
      - name: Proof — B-3 (baseline must PASS on clean source)
        run: |
          set -e
          bunx playwright test --grep "B-3" --project=mobile-360 \
            --reporter=json > /tmp/b3-baseline.json || true
          node scripts/assert-playwright-result.mjs /tmp/b3-baseline.json pass "B-3 baseline"

      - name: Proof — B-3 (mutated source must FAIL)
        run: |
          set -e
          git apply e2e/proofs/b3-enumeration.patch
          bunx playwright test --grep "B-3" --project=mobile-360 \
            --reporter=json > /tmp/b3-mutated.json || true
          node scripts/assert-playwright-result.mjs /tmp/b3-mutated.json fail "B-3 mutated"
          git checkout -- src/

      - name: Proof — C-4 (baseline must PASS on clean source)
        run: |
          set -e
          bunx playwright test --grep "C-4" --project=mobile-360 \
            --reporter=json > /tmp/c4-baseline.json || true
          node scripts/assert-playwright-result.mjs /tmp/c4-baseline.json pass "C-4 baseline"

      - name: Proof — C-4 (mutated source must FAIL)
        run: |
          set -e
          git apply e2e/proofs/c4-arbitrary-recipient.patch
          bunx playwright test --grep "C-4" --project=mobile-360 \
            --reporter=json > /tmp/c4-mutated.json || true
          node scripts/assert-playwright-result.mjs /tmp/c4-mutated.json fail "C-4 mutated"
          git checkout -- src/

      - name: Assert src/ is clean (no mutation survives this job)
        if: always()
        run: |
          git checkout -- src/ || true
          if [ -n "$(git status --porcelain src/)" ]; then
            echo "::error::src/ is dirty after the proof run"
            git status --porcelain src/
            exit 1
          fi
          echo "src/ is clean"
