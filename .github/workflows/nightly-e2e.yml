name: Nightly E2E

# Cases that need REAL elapsed time (A-3 resend exhaustion). See
# docs/features/nightly-e2e.md. Deliberately NOT triggered on push.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-e2e:
    name: Nightly E2E (Playwright, real time, ethio-staging)
    runs-on: ubuntu-latest
    env:
      # INC-018 (recurrence, 2026-08-04): this block MUST mirror ci.yml's e2e job
      # exactly. It previously pinned the sink flag to "1" while ci.yml read it
      # from the repository variable, so when staging SMTP moved from Mailtrap to
      # Ethereal (ruling R1) the nightly kept sending against the retired sink and
      # every sign-up 500'd. One source of truth: the same variable ci.yml reads.
      # INC-080: the nightly is a single-process job, hence the only place a
      # namespace-wide sweep is allowed.
      E2E_SHARD: nightly
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # The build must point the app at staging, never at ethio-prod.
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      # DEC-018 — the suite runs against the BUILT app, with the test
      # instruments compiled in (src/lib/env-flags.ts). PROD is unaffected:
      # VITE_E2E is set here and by `bun run build:e2e` only.
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "1"
      # U4c — FAKE MODE: the /api/translate route skips Google entirely, so CI
      # needs no provider key and spends nothing. PROD is unaffected.
      E2E_FAKE_TRANSLATE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # DEC-018: E2E runs the PRODUCTION build in E2E mode. Each job builds its
      # own dist/ (the build is seconds and needs the job's VITE_* env anyway);
      # artifact-sharing was not worth the plumbing.
      - name: Build the app in E2E mode (VITE_E2E=1)
        run: bun run build:e2e
      # INC-085e — the build step is not allowed to hand a missing artifact to
      # the serve step: ENOENT at the serve step is a symptom of a build-time
      # drift, and it cost six jobs once.
      # DEC-019/INC-088 — the e2e serve runtime is nitro's node-server, so the
      # artifact that must exist is the node entry, not wrangler.json.
      - name: Verify e2e build output
        run: test -f dist/server/index.mjs || { echo "::error::e2e build did not emit dist/server/index.mjs — nitro target drift"; echo "--- emitted tree ---"; find dist .output -maxdepth 3 -type f 2>/dev/null | head -60; exit 1; }
      # The verdict of the job is THIS step and nothing else. continue-on-error
      # lets the heartbeat run afterwards; the final step re-raises the failure so
      # a red suite can never be hidden by a green bookkeeping commit.
      # INC-080: stale-orphan reaping lives HERE, never in a parallel shard's
      # teardown. Deletes only @ethio-e2e.invalid users older than 24h; the
      # standing proof fixtures (proof-base@staging.test, proof-third@staging.test)
      # are on another domain and the per-user namespace assert refuses them.
      - name: Sweep stale E2E users (older than 24h)
        run: bun -e 'const m = await import("./e2e/global-teardown.ts"); await m.sweepStaleUsers();'
      - name: Run nightly E2E
        id: run
        continue-on-error: true
        run: bunx playwright test -c playwright.nightly.config.ts
      - name: Upload report on failure
        if: always() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 7

      # Heartbeat: must run even when the tests fail, so a schedule that stopped
      # running is distinguishable from one that ran and passed.
      #
      # INC-027: the push used to be a bare checkout->commit->push. A commit landing
      # on the branch mid-run rejected it ("fetch first"), the step failed, and the
      # whole job went red while the file stayed stale. DEC-020: the heartbeat
      # now targets dev, never main. Two changes: the status
      # file is REGENERATED after every fetch (it is derived state — the run owns
      # every field, so rewriting is always safe and never conflicts), and a push
      # that still fails after 3 attempts is a warning, not a job failure.
      - name: Write and push heartbeat
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ONE source for the file's content, used on every attempt.
          write_status() {
            mkdir -p docs/tracking
            {
              echo "# Nightly E2E status"
              echo
              echo "Machine-generated by .github/workflows/nightly-e2e.yml. Do not edit."
              echo
              if [ "$RUN_OUTCOME" = "success" ]; then
                echo "- Conclusion: SUCCESS"
              else
                echo "- Conclusion: FAILURE"
              fi
              echo "- Commit: ${RUN_SHA}"
              echo "- Timestamp (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "- Run: ${RUN_URL}"
            } > docs/tracking/nightly-status.md
          }

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin dev
            git reset --hard origin/dev
            write_status
            git add docs/tracking/nightly-status.md
            if git diff --cached --quiet; then
              echo "No heartbeat change to commit."
              pushed=1
              break
            fi
            git commit -m "chore(ci): nightly E2E heartbeat [skip ci]"
            if git push origin HEAD:dev; then
              pushed=1
              break
            fi
            echo "Heartbeat push rejected (attempt ${attempt}/3); refetching."
            sleep 5
          done

          if [ "$pushed" -ne 1 ]; then
            echo "::warning::heartbeat push failed after retries"
          fi
          exit 0

      # Re-assert the authoritative outcome captured above.
      - name: Report test outcome
        if: always()
        run: |
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            echo "Nightly E2E suite failed."
            exit 1
          fi
          echo "Nightly E2E suite passed."

  # DEC-019 / INC-088 — CLOUDFLARE PARITY SMOKE.
  # The per-push suite serves the built app on nitro's node-server preset
  # because `wrangler dev` cannot boot a worker whose compatibility_date is the
  # build day. The DEPLOY target is still Cloudflare, so exactly one job per
  # night must prove the same code boots and serves on workerd. It is allowed
  # to be red for the runtime reason alone — the step prints the distinction —
  # but a genuine application break here is a real signal.
  cloudflare-parity-smoke:
    name: Cloudflare parity smoke (wrangler-served)
    runs-on: ubuntu-latest
    env:
      E2E_SHARD: cfsmoke
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "cloudflare"
      # U4c — FAKE MODE: the /api/translate route skips Google entirely, so CI
      # needs no provider key and spends nothing. PROD is unaffected.
      E2E_FAKE_TRANSLATE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build the app for the Cloudflare target (VITE_E2E=1)
        run: bun run build:e2e:cloudflare
      - name: Verify the worker artifact
        run: test -f dist/server/wrangler.json || { echo "::error::cloudflare e2e build did not emit dist/server/wrangler.json — nitro target drift"; find dist -maxdepth 3 -type f | head -60; exit 1; }
      - name: Run the smoke tier on workerd
        run: |
          set -o pipefail
          bunx playwright test --project=mobile-360 e2e/smoke-auth-i18n.spec.ts 2>&1 | tee cf-smoke.log || {
            if grep -q "newest date supported by this server binary" cf-smoke.log; then
              echo "::error::workerd refused the build-day compatibility_date (INC-088 runtime class) — the application itself was never exercised."
            fi
            exit 1
          }
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cf-parity
          path: playwright-report/
          retention-days: 7
