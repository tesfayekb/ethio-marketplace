name: Flake check

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Space-separated spec paths, e.g. e2e/post-wizard-place.spec.ts e2e/post-wizard-bundle2.spec.ts"
        type: string
        required: true
      grep:
        description: "Playwright grep regex, e.g. PW-12 |PW-117 |PW-178 "
        type: string
        required: true
      repeat:
        description: Repeats per test
        type: string
        default: "12"
      workers:
        description: Worker count
        type: string
        default: "8"

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # DEC-153 (a) / INC-676 — publish-evidence.sh pushes status and failure evidence.
    permissions:
      contents: write
      actions: read
    env:
      # INC-018 (recurrence, 2026-08-04): this block MUST mirror ci.yml's e2e job
      # exactly. It previously pinned the sink flag to "1" while ci.yml read it
      # from the repository variable, so when staging SMTP moved from Mailtrap to
      # Ethereal (ruling R1) the nightly kept sending against the retired sink and
      # every sign-up 500'd. One source of truth: the same variable ci.yml reads.
      # INC-080: the nightly is a single-process job, hence the only place a
      # namespace-wide sweep is allowed.
      E2E_SHARD: flake
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # The build must point the app at staging, never at ethio-prod.
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # DEC-018 — the suite runs against the BUILT app, with the test
      # instruments compiled in (src/lib/env-flags.ts). PROD is unaffected:
      # VITE_E2E is set here and by `bun run build:e2e` only.
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "1"
      # U4c — FAKE MODE: the /api/translate route skips Google entirely, so CI
      # needs no provider key and spends nothing. PROD is unaffected.
      E2E_FAKE_TRANSLATE: "1"
      E2E_FAKE_GEOCODE: "1"
      # DEC-030 — the NIGHTLY keeps the unretried truth: acceptance measurement
      # (pass bar §6) needs retries: 0. Only the parallel matrix retries once.
      E2E_RETRIES: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        timeout-minutes: 12
        run: bash scripts/ci/with-deadline.sh 300 2 -- bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # INC-943 (DEC-276): measured over 371 lane runs, the combined install took 14 s at the median, 582 s at the
      # 90th percentile and 895 s at most. A package install cut off part-way cannot be repeated, so the system
      # libraries run once with 1500 s; the browser download may be repeated, 900 s a try.
      - name: Install Chromium's system libraries
        timeout-minutes: 27
        run: bash scripts/ci/with-deadline.sh 1500 1 -- bunx playwright install-deps chromium
      - name: Install Chromium
        timeout-minutes: 32
        run: bash scripts/ci/with-deadline.sh 900 2 -- bunx playwright install chromium
      # DEC-018: E2E runs the PRODUCTION build in E2E mode. Each job builds its
      # own dist/ (the build is seconds and needs the job's VITE_* env anyway);
      # artifact-sharing was not worth the plumbing.
      - name: Build the app in E2E mode (VITE_E2E=1)
        run: bun run build:e2e
      # INC-085e — the build step is not allowed to hand a missing artifact to
      # the serve step: ENOENT at the serve step is a symptom of a build-time
      # drift, and it cost six jobs once.
      # DEC-019/INC-088 — the e2e serve runtime is nitro's node-server, so the
      # artifact that must exist is the node entry, not wrangler.json.
      - name: Verify e2e build output
        run: test -f dist/server/index.mjs || { echo "::error::e2e build did not emit dist/server/index.mjs — nitro target drift"; echo "--- emitted tree ---"; find dist .output -maxdepth 3 -type f 2>/dev/null | head -60; exit 1; }
      # DEC-168 — THE STAGING GATE: wait (up to 60 minutes) until no CI, Guard
      # Proof or Feed bench run is using ethio-staging; run anyway after that,
      # with a warning. Never a stop: an unreadable gate is a warning too.
      - name: Staging gate (DEC-168)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/staging-gate.ts wait 60
      - name: Run the repeat
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          bunx playwright test --project=mobile-360 --project=desktop-1280 --grep "${{ inputs.grep }}" --repeat-each ${{ inputs.repeat }} --workers ${{ inputs.workers }} --retries 0 ${{ inputs.specs }} 2>&1 | tee flake.log
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flake-check-report
          path: |
            playwright-report
            flake.log
      - name: Render flake evidence
        id: evidence
        if: always()
        env:
          E2E_OUT_PATH: docs/tracking/flake-check-last-failure.md
          E2E_SOURCE_LABEL: flake
          E2E_RESULTS_DIR: flake-results
          E2E_LOGS_DIR: flake-logs
          E2E_CONTEXT_DIR: test-results
          E2E_EXPECTED_SOURCES: flake
          E2E_GREEN: ${{ steps.run.outcome == 'success' && '1' || '0' }}
          E2E_VERDICT_PATH: /tmp/flake-verdict.txt
          E2E_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Zero retries: the Flake check must never write the shared flake ledger.
          E2E_FLAKE_LEDGER: /tmp/flake-check-ledger-unused.md
        run: |
          set -u
          mkdir -p flake-results/e2e-results-flake flake-logs/e2e-log-flake
          cp test-results/results.json flake-results/e2e-results-flake/results.json 2>/dev/null || true
          cp flake.log flake-logs/e2e-log-flake/flake.log 2>/dev/null || true
          bun scripts/e2e-failure-report.ts || echo "::warning::flake failure reporter exited non-zero"
          # A missing verdict is a reporter failure, never a green verdict.
          if [ -f /tmp/flake-verdict.txt ]; then
            cat /tmp/flake-verdict.txt
            GATING=$(grep -o '^gating=[0-9]*' /tmp/flake-verdict.txt | cut -d= -f2)
          else
            GATING=1
            echo "::warning::no verdict file — the reporter did not publish one; treating as gating"
          fi
          echo "gating=${GATING}" >> "$GITHUB_OUTPUT"
      - name: Write and push flake status
        if: always()
        env:
          RUN_GATING: ${{ steps.evidence.outputs.gating }}
          RUN_SPECS: ${{ inputs.specs }}
          RUN_GREP: ${{ inputs.grep }}
          RUN_REPEAT: ${{ inputs.repeat }}
          RUN_WORKERS: ${{ inputs.workers }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          mkdir -p docs/tracking
          {
            echo "# Flake check status"
            echo
            echo "Machine-generated by .github/workflows/flake-check.yml. Do not edit."
            echo
            if [ "${RUN_GATING:-1}" = "0" ]; then
              echo "- Conclusion: SUCCESS"
            else
              echo "- Conclusion: FAILURE"
            fi
            echo "- Gating failures: ${RUN_GATING:-unknown}"
            echo "- Specs: ${RUN_SPECS}"
            echo "- Grep: ${RUN_GREP}"
            echo "- Repeat: ${RUN_REPEAT} · Workers: ${RUN_WORKERS}"
            echo "- Commit: ${RUN_SHA}"
            echo "- Timestamp (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- Run: ${RUN_URL}"
          } > docs/tracking/flake-check-status.md
          # DEC-098 — publication targets ci-evidence only; a failed push warns.
          bash scripts/publish-evidence.sh "chore(ci): flake check evidence [skip ci]" \
            docs/tracking/flake-check-status.md docs/tracking/flake-check-last-failure.md
      - name: Staging overlaps (DEC-168)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/staging-gate.ts overlaps
      - name: Report test outcome
        if: always()
        env:
          RUN_GATING: ${{ steps.evidence.outputs.gating }}
        run: |
          if [ "${RUN_GATING:-1}" != "0" ]; then
            echo "Flake check: ${RUN_GATING:-unknown} failing run(s) — read docs/tracking/flake-check-last-failure.md on branch ci-evidence"
            exit 1
          fi
          exit 0
