name: Flake check

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Space-separated spec paths, e.g. e2e/post-wizard-place.spec.ts e2e/post-wizard-bundle2.spec.ts"
        type: string
        required: true
      grep:
        description: "Playwright grep regex, e.g. PW-12 |PW-117 |PW-178 "
        type: string
        required: true
      repeat:
        description: Repeats per test
        type: string
        default: "12"
      workers:
        description: Worker count
        type: string
        default: "8"

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      # INC-018 (recurrence, 2026-08-04): this block MUST mirror ci.yml's e2e job
      # exactly. It previously pinned the sink flag to "1" while ci.yml read it
      # from the repository variable, so when staging SMTP moved from Mailtrap to
      # Ethereal (ruling R1) the nightly kept sending against the retired sink and
      # every sign-up 500'd. One source of truth: the same variable ci.yml reads.
      # INC-080: the nightly is a single-process job, hence the only place a
      # namespace-wide sweep is allowed.
      E2E_SHARD: flake
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # The build must point the app at staging, never at ethio-prod.
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # DEC-018 — the suite runs against the BUILT app, with the test
      # instruments compiled in (src/lib/env-flags.ts). PROD is unaffected:
      # VITE_E2E is set here and by `bun run build:e2e` only.
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "1"
      # U4c — FAKE MODE: the /api/translate route skips Google entirely, so CI
      # needs no provider key and spends nothing. PROD is unaffected.
      E2E_FAKE_TRANSLATE: "1"
      E2E_FAKE_GEOCODE: "1"
      # DEC-030 — the NIGHTLY keeps the unretried truth: acceptance measurement
      # (pass bar §6) needs retries: 0. Only the parallel matrix retries once.
      E2E_RETRIES: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # DEC-018: E2E runs the PRODUCTION build in E2E mode. Each job builds its
      # own dist/ (the build is seconds and needs the job's VITE_* env anyway);
      # artifact-sharing was not worth the plumbing.
      - name: Build the app in E2E mode (VITE_E2E=1)
        run: bun run build:e2e
      # INC-085e — the build step is not allowed to hand a missing artifact to
      # the serve step: ENOENT at the serve step is a symptom of a build-time
      # drift, and it cost six jobs once.
      # DEC-019/INC-088 — the e2e serve runtime is nitro's node-server, so the
      # artifact that must exist is the node entry, not wrangler.json.
      - name: Verify e2e build output
        run: test -f dist/server/index.mjs || { echo "::error::e2e build did not emit dist/server/index.mjs — nitro target drift"; echo "--- emitted tree ---"; find dist .output -maxdepth 3 -type f 2>/dev/null | head -60; exit 1; }
      # DEC-168 — THE STAGING GATE: wait (up to 60 minutes) until no CI, Guard
      # Proof or Feed bench run is using ethio-staging; run anyway after that,
      # with a warning. Never a stop: an unreadable gate is a warning too.
      - name: Staging gate (DEC-168)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/staging-gate.ts wait 60
      - name: Run the repeat
        run: |
          set -o pipefail
          bunx playwright test --project=mobile-360 --project=desktop-1280 --grep "${{ inputs.grep }}" --repeat-each ${{ inputs.repeat }} --workers ${{ inputs.workers }} --retries 0 --reporter=list,html ${{ inputs.specs }} 2>&1 | tee flake.log
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flake-check-report
          path: |
            playwright-report
            flake.log
      - name: Staging overlaps (DEC-168)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/staging-gate.ts overlaps
