name: CI Status Report

# Loop-safety:
#  - triggers ONLY on workflow_run of "CI" (never on push), so its own commit
#    cannot re-trigger it;
#  - the commit message carries [skip ci];
#  - CI's push trigger ignores docs/tracking/ci-status.md.
# DEC-020: every tracking commit targets dev; main only ever moves by the
# promote job's fast-forward, or by the operator-triggered sync-main dispatch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Operator-only entry point for the sync-main repair job below. The report
  # job is gated to workflow_run so a dispatch can never write a status file.
  workflow_dispatch:

jobs:
  report:
    name: Write CI status to repo
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Build status file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 }
            );
            const sha = run.head_sha;
            const lines = [
              '# CI Status (auto-generated — do not edit by hand)',
              '',
              `- Commit: \`${sha}\` (short \`${sha.slice(0, 7)}\`)`,
              `- Conclusion: **${String(run.conclusion || 'unknown').toUpperCase()}**`,
              `- Completed (UTC): ${run.updated_at}`,
              `- Run: ${run.html_url}`,
              '',
              '## Jobs',
              '',
              '| Job | Conclusion |',
              '| --- | ---------- |',
              ...jobs.map((j) => `| ${j.name} | ${j.conclusion ?? j.status} |`),
              '',
            ];
            fs.mkdirSync('docs/tracking', { recursive: true });
            fs.writeFileSync('docs/tracking/ci-status.md', lines.join('\n'));
            // Keep a copy outside the worktree so the push step can REGENERATE
            // the file after every fetch/reset (see below).
            fs.writeFileSync('/tmp/ci-status.md', lines.join('\n'));

      # Regenerate-after-fetch + retry, mirroring nightly-e2e.yml (INC-027).
      # The status file is derived state owned entirely by this run, so
      # rewriting it on top of whatever dev now holds is always correct and
      # can never conflict. A failed push is a warning, never a red job — the
      # reporter must not redden Actions on its own bookkeeping.
      - name: Commit and push
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin dev
            git reset --hard origin/dev
            mkdir -p docs/tracking
            cp /tmp/ci-status.md docs/tracking/ci-status.md
            git add docs/tracking/ci-status.md
            if git diff --cached --quiet; then
              echo "No status change; nothing to commit."
              pushed=1
              break
            fi
            git commit -m "ci: update CI status report [skip ci]"
            if git push origin HEAD:dev; then
              pushed=1
              break
            fi
            echo "Status push rejected (attempt ${attempt}/3); refetching."
            sleep 5
          done

          if [ "$pushed" -ne 1 ]; then
            echo "::warning::CI status push failed after retries"
          fi
          exit 0

  # DEC-020 divergence repair — the ONLY sanctioned non-fast-forward path to
  # main. Operator-triggered only (workflow_dispatch), never automatic. Use it
  # when the promote guard reports "MAIN DIVERGED" and the operator has
  # confirmed main's extra commits are tracking-only (ci-status.md /
  # e2e-last-failure.md [skip ci] commits). It force-pushes dev over main with
  # --force-with-lease, after echoing exactly what is being overwritten.
  sync-main:
    name: sync-main — DEC-020 divergence repair
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Show what will be overwritten
        run: |
          set -eu
          git fetch origin main dev
          echo "main HEAD: $(git rev-parse origin/main)"
          echo "dev  HEAD: $(git rev-parse origin/dev)"
          echo "--- commits on main that are NOT on dev (these will be DISCARDED) ---"
          git log --oneline origin/main --not origin/dev || true
          echo "--- end ---"
          echo "--- commits on dev that are not on main (these will be ADOPTED) ---"
          git log --oneline origin/dev --not origin/main || true
          echo "--- end ---"

      - name: Force main to dev (lease-protected)
        run: |
          set -eu
          git push --force-with-lease=main:"$(git rev-parse origin/main)" origin origin/dev:main
          echo "main is now $(git rev-parse origin/dev)"
