name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/tracking/ci-status.md']
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    name: Build, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Format check (pinned prettier; .prettierignore exempts ratified records)
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Bundle report
        run: |
          echo "=== Client JS bundle report ==="
          if [ -d ".output/public" ]; then
            find .output/public -type f -name "*.js" | xargs du -ch 2>/dev/null | tail -n 1
          elif [ -d "dist" ]; then
            find dist -type f -name "*.js" | xargs du -ch 2>/dev/null | tail -n 1
          else
            echo "No known build output directory found (.output/public or dist)."
          fi

  secrets-scan:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-lint:
    name: Migration linter (with self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migration guard
        run: bash scripts/check-migrations.sh

  string-scan:
    name: Hardcoded string scan (enforcing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run string scan
        run: bash scripts/check-hardcoded-strings.sh

  e2e:
    name: E2E (Playwright, ethio-staging)
    runs-on: ubuntu-latest
    env:
      # ethio-staging — publishable values only; the service-role key is a secret.
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # The build must point the app at staging, never at ethio-prod.
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run E2E (dev-server mode; production build is validated in build-and-check)
        run: bunx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

