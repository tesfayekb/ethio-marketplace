name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/tracking/ci-status.md"
      - "docs/tracking/nightly-status.md"
      - "docs/tracking/e2e-last-failure.md"
  pull_request:
    branches: [main]

# Lovable's platform pushes several commits per task, so an in-flight run for an
# older HEAD is obsolete the moment a newer one starts. Cancelling it keeps the
# status file (G18) unambiguous: it always reflects the newest push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-check:
    name: Build, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # INC-076: the deletion guard needs the previous main commit in the
          # local object store, so the shallow default will not do.
          fetch-depth: 0
      # INC-076 (ratified): a push that deletes files must SAY so. The guard is
      # self-tested in both directions before it is trusted.
      - name: No unexplained deletions (with self-test)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          SELF_TEST=1 bash scripts/check-deletions.sh
          bash scripts/check-deletions.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Format check (pinned prettier; .prettierignore exempts ratified records)
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Bundle report
        run: |
          echo "=== Client JS bundle report ==="
          if [ -d ".output/public" ]; then
            find .output/public -type f -name "*.js" | xargs du -ch 2>/dev/null | tail -n 1
          elif [ -d "dist" ]; then
            find dist -type f -name "*.js" | xargs du -ch 2>/dev/null | tail -n 1
          else
            echo "No known build output directory found (.output/public or dist)."
          fi

  secrets-scan:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-lint:
    name: Migration linter (with self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Self-tests first: a guard that only ever passes proves nothing.
      - name: Guard self-tests (RLS fixture + SECURITY DEFINER sample)
        run: SELF_TEST=1 bash scripts/check-migrations.sh
      - name: Run migration guard
        run: bash scripts/check-migrations.sh

  string-scan:
    name: Hardcoded string scan (enforcing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run string scan
        run: bash scripts/check-hardcoded-strings.sh

  listing-write-seam:
    name: Listing-write seam guard (with self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Direction 1: the guard must PASS on real source.
      - name: Guard src/
        run: bash scripts/check-listing-writes.sh src
      # Direction 2: the guard must FAIL on the known-bad fixture. A guard that
      # only ever passes proves nothing (same discipline as the migration linter).
      - name: Self-test — guard must reject the bad fixture
        run: |
          set +e
          bash scripts/check-listing-writes.sh scripts/fixtures
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::GUARD SELF-TEST FAILED: bad fixture was not flagged."
            exit 1
          fi
          echo "Self-test OK: bad fixture correctly flagged."

  browse-path-guard:
    name: Browse-path guard (no RBAC seam on the marketplace path, with self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Direction 1: the guard must PASS on real source.
      - name: Guard src/
        run: bash scripts/check-browse-imports.sh src
      # Direction 2: the guard must FAIL on the known-bad fixture.
      - name: Self-test — guard must reject the bad fixture
        run: |
          set +e
          bash scripts/check-browse-imports.sh scripts/fixtures
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::GUARD SELF-TEST FAILED: bad fixture was not flagged."
            exit 1
          fi
          echo "Self-test OK: bad fixture correctly flagged."

  marketplace-weight:
    name: Marketplace weight guard (no heavy deps on the first-paint path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard the marketplace module graph
        run: node scripts/check-marketplace-imports.mjs

  bundle-budget:
    name: First-paint bundle budget (gzipped ceiling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      # Ratchet, not a suggestion: raising the ceiling is a deliberate commit.
      - name: Check the first-paint budget
        run: node scripts/check-bundle-size.mjs

  dependency-audit:
    name: Dependency vulnerability audit (enforcing on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Law H2 (no known-error debt): the gate FAILS on high/critical findings.
      # Accepted, documented exceptions live in docs/features/dependency-audit.md
      # and are listed here explicitly — never as a blanket "|| true".
      - name: Audit
        run: |
          set +e
          bun audit --audit-level=high >/tmp/audit.txt 2>&1
          STATUS=$?
          cat /tmp/audit.txt
          # A transport failure is NOT a clean bill of health and NOT a finding.
          # It is reported as its own distinct red so nobody reads a broken
          # registry call as "no vulnerabilities" (law F4).
          if grep -qi "audit request failed" /tmp/audit.txt; then
            echo "::error::'bun audit' could not reach the advisory service. This gate did NOT run."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::High or critical vulnerabilities reported by 'bun audit'."
            echo "Review docs/features/dependency-audit.md, then remediate or record a ruling."
            exit 1
          fi
          echo "No high or critical advisories."

  # ── E2E TIERS ──────────────────────────────────────────────────────────────
  # One preflight, one fast smoke tier, four parallel shards, one merged
  # verdict. The merged job keeps the historical name so the CI status
  # reporter's table row ("E2E (Playwright, ethio-staging)") is unchanged.

  e2e-preflight:
    name: E2E preflight (migration parity, staging)
    runs-on: ubuntu-latest
    env:
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun cache hit?
        run: echo "bun cache-hit=${{ steps.bun-cache.outputs.cache-hit }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # INC-074: staging must carry the newest local migration, or the suite
      # fails with N cryptic reds instead of one named file.
      - name: Migration parity preflight (staging)
        run: bun scripts/e2e-migration-preflight.ts

  e2e-smoke:
    name: E2E smoke tier
    needs: e2e-preflight
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun cache hit?
        run: echo "bun cache-hit=${{ steps.bun-cache.outputs.cache-hit }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Playwright cache hit?
        run: echo "playwright cache-hit=${{ steps.pw-cache.outputs.cache-hit }}"
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # The smoke tier is a FILE LIST, not a title grep: tagging shell.spec.ts
      # and auth-signout.spec.ts would edit specs outside this task's scope, and
      # a file list carries the same meaning with zero test-logic change.
      - name: Run the smoke tier (fail fast)
        run: bunx playwright test e2e/smoke-auth-i18n.spec.ts e2e/shell.spec.ts e2e/auth-signout.spec.ts

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    needs: e2e-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun cache hit?
        run: echo "bun cache-hit=${{ steps.bun-cache.outputs.cache-hit }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Playwright cache hit?
        run: echo "playwright cache-hit=${{ steps.pw-cache.outputs.cache-hit }}"
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run E2E shard (dev-server mode; the production build is validated in build-and-check)
        run: bunx playwright test --shard=${{ matrix.shard }}/4
      # Every shard uploads its JSON reporter output, pass or fail — the merged
      # report must see ALL failures, not only those of the first red shard.
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  e2e:
    # HISTORICAL NAME PRESERVED: docs/tracking/ci-status.md lists one row per
    # job, and downstream reads key off this exact string. It is now the MERGED
    # verdict for the four shards.
    name: E2E (Playwright, ethio-staging)
    needs: [e2e-smoke, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: shard-results
      # MERGE MECHANISM: JSON concatenation, not `playwright merge-reports`.
      # The consumer is scripts/e2e-failure-report.ts, which reads the JSON
      # reporter shape; E2E_RESULTS_DIR makes it walk every shard's
      # results.json and sum stats across them.
      - name: Publish merged E2E report
        env:
          E2E_RESULTS_DIR: shard-results
          E2E_GREEN: ${{ (needs.e2e-shard.result == 'success' && needs.e2e-smoke.result == 'success') && '1' || '0' }}
          E2E_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          # The self-test runs FIRST: a reporter that only ever prints "no
          # failures" proves nothing.
          SELF_TEST=1 bun scripts/e2e-failure-report.ts
          bun scripts/e2e-failure-report.ts
          cp docs/tracking/e2e-last-failure.md /tmp/e2e-last-failure.md
          # Regenerate-after-fetch + retry, IDENTICAL to ci-status-report.yml:
          # the file is derived state owned by this run, so rewriting it on top
          # of whatever main now holds can never conflict. A push failure is a
          # ::warning, never a red — bookkeeping must not redden Actions.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p docs/tracking
            cp /tmp/e2e-last-failure.md docs/tracking/e2e-last-failure.md
            git add docs/tracking/e2e-last-failure.md
            if git diff --cached --quiet; then
              echo "No report change; nothing to commit."
              pushed=1
              break
            fi
            git commit -m "ci: e2e failure report [skip ci]"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Report push rejected (attempt ${attempt}/3); refetching."
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::warning::E2E failure report push failed after retries"
          fi
          exit 0
      # Law F4 — the merged job's conclusion IS the E2E verdict. A red shard or
      # a red smoke tier reddens this row; bookkeeping never masks it.
      - name: Verdict
        run: |
          echo "smoke=${{ needs.e2e-smoke.result }} shards=${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-smoke.result }}" != "success" ] || [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::E2E failed — see docs/tracking/e2e-last-failure.md"
            exit 1
          fi
          echo "All E2E shards and the smoke tier passed."
