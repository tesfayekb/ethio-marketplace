name: CI

# DEC-020 — CI lives on dev. main receives pushes ONLY from the `promote`
# job below (fast-forward on full green), so a push-triggered run on main
# would be a no-op echo of dev's run at the identical SHA. main is the
# certified-green record; red never lands there.
on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/tracking/ci-status.md"
      - "docs/tracking/nightly-status.md"
      - "docs/tracking/e2e-last-failure.md"
  pull_request:
    branches: [dev]

# Lovable's platform pushes several commits per task, so an in-flight run for an
# older HEAD is obsolete the moment a newer one starts. Cancelling it keeps the
# status file (G18) unambiguous: it always reflects the newest push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # INC-076: the deletion guard needs the previous main commit in the
          # local object store, so the shallow default will not do.
          fetch-depth: 0
      # INC-076 (ratified): a push that deletes files must SAY so. The guard is
      # self-tested in both directions before it is trusted.
      - name: No unexplained deletions (with self-test)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          SELF_TEST=1 bash scripts/check-deletions.sh
          bash scripts/check-deletions.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Format check (pinned prettier; .prettierignore exempts ratified records)
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Bundle report
        run: |
          echo "=== Client JS bundle report ==="
          if [ -d ".output/public" ]; then
            find .output/public -type f -name "*.js" | xargs du -ch 2>/dev/null | tail -n 1
          elif [ -d "dist" ]; then
            find dist -type f -name "*.js" | xargs du -ch 2>/dev/null | tail -n 1
          else
            echo "No known build output directory found (.output/public or dist)."
          fi

  secrets-scan:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-lint:
    name: Migration linter (with self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Self-tests first: a guard that only ever passes proves nothing.
      - name: Guard self-tests (RLS fixture + SECURITY DEFINER sample)
        run: SELF_TEST=1 bash scripts/check-migrations.sh
      - name: Run migration guard
        run: bash scripts/check-migrations.sh

  string-scan:
    name: Hardcoded string scan (enforcing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run string scan
        run: bash scripts/check-hardcoded-strings.sh

  listing-write-seam:
    name: Listing-write seam guard (with self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Direction 1: the guard must PASS on real source.
      - name: Guard src/
        run: bash scripts/check-listing-writes.sh src
      # Direction 2: the guard must FAIL on the known-bad fixture. A guard that
      # only ever passes proves nothing (same discipline as the migration linter).
      - name: Self-test — guard must reject the bad fixture
        run: |
          set +e
          bash scripts/check-listing-writes.sh scripts/fixtures
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::GUARD SELF-TEST FAILED: bad fixture was not flagged."
            exit 1
          fi
          echo "Self-test OK: bad fixture correctly flagged."

  browse-path-guard:
    name: Browse-path guard (no RBAC seam on the marketplace path, with self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Direction 1: the guard must PASS on real source.
      - name: Guard src/
        run: bash scripts/check-browse-imports.sh src
      # Direction 2: the guard must FAIL on the known-bad fixture.
      - name: Self-test — guard must reject the bad fixture
        run: |
          set +e
          bash scripts/check-browse-imports.sh scripts/fixtures
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::GUARD SELF-TEST FAILED: bad fixture was not flagged."
            exit 1
          fi
          echo "Self-test OK: bad fixture correctly flagged."

  marketplace-weight:
    name: Marketplace weight guard (no heavy deps on the first-paint path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Guard the marketplace module graph
        run: node scripts/check-marketplace-imports.mjs

  bundle-budget:
    name: First-paint bundle budget (gzipped ceiling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      # Ratchet, not a suggestion: raising the ceiling is a deliberate commit.
      - name: Check the first-paint budget
        run: node scripts/check-bundle-size.mjs

  dependency-audit:
    name: Dependency vulnerability audit (enforcing on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Law H2 (no known-error debt): the gate FAILS on high/critical findings.
      # Accepted, documented exceptions live in docs/features/dependency-audit.md
      # and are listed here explicitly — never as a blanket "|| true".
      - name: Audit
        run: |
          set +e
          bun audit --audit-level=high >/tmp/audit.txt 2>&1
          STATUS=$?
          cat /tmp/audit.txt
          # A transport failure is NOT a clean bill of health and NOT a finding.
          # It is reported as its own distinct red so nobody reads a broken
          # registry call as "no vulnerabilities" (law F4).
          if grep -qi "audit request failed" /tmp/audit.txt; then
            echo "::error::'bun audit' could not reach the advisory service. This gate did NOT run."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::High or critical vulnerabilities reported by 'bun audit'."
            echo "Review docs/features/dependency-audit.md, then remediate or record a ruling."
            exit 1
          fi
          echo "No high or critical advisories."

  # ── E2E TIERS ──────────────────────────────────────────────────────────────
  # One preflight, one fast smoke tier, four parallel shards, one merged
  # verdict. The merged job keeps the historical name so the CI status
  # reporter's table row ("E2E (Playwright, ethio-staging)") is unchanged.

  e2e-preflight:
    name: E2E preflight (migration parity, staging)
    runs-on: ubuntu-latest
    env:
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun cache hit?
        run: echo "bun cache-hit=${{ steps.bun-cache.outputs.cache-hit }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # INC-074: staging must carry the newest local migration, or the suite
      # fails with N cryptic reds instead of one named file.
      - name: Migration parity preflight (staging)
        run: bun scripts/e2e-migration-preflight.ts

  e2e-smoke:
    name: E2E smoke tier
    needs: e2e-preflight
    runs-on: ubuntu-latest
    env:
      # INC-080: fixture ownership boundary. All shards share GITHUB_RUN_ID, so
      # the shard id is what makes each process's fixtures its own.
      E2E_SHARD: smoke
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      # DEC-018 — the suite runs against the BUILT app, with the test
      # instruments compiled in (src/lib/env-flags.ts). PROD is unaffected:
      # VITE_E2E is set here and by `bun run build:e2e` only.
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "1"
      # U4c — FAKE MODE: the /api/translate route skips Google entirely, so CI
      # needs no provider key and spends nothing. PROD is unaffected.
      E2E_FAKE_TRANSLATE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun cache hit?
        run: echo "bun cache-hit=${{ steps.bun-cache.outputs.cache-hit }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Playwright cache hit?
        run: echo "playwright cache-hit=${{ steps.pw-cache.outputs.cache-hit }}"
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # DEC-018: E2E runs the PRODUCTION build in E2E mode. Each job builds its
      # own dist/ (the build is seconds and needs the job's VITE_* env anyway);
      # artifact-sharing was not worth the plumbing.
      - name: Build the app in E2E mode (VITE_E2E=1)
        run: bun run build:e2e
      # INC-085e — the build step is not allowed to hand a missing artifact to
      # the serve step: ENOENT at the serve step is a symptom of a build-time
      # drift, and it cost six jobs once.
      # DEC-019/INC-088 — the e2e serve runtime is nitro's node-server, so the
      # artifact that must exist is the node entry, not wrangler.json.
      - name: Verify e2e build output
        run: test -f dist/server/index.mjs || { echo "::error::e2e build did not emit dist/server/index.mjs — nitro target drift"; echo "--- emitted tree ---"; find dist .output -maxdepth 3 -type f 2>/dev/null | head -60; exit 1; }
      # The smoke tier is a FILE LIST, not a title grep: tagging shell.spec.ts
      # and auth-signout.spec.ts would edit specs outside this task's scope, and
      # a file list carries the same meaning with zero test-logic change.
      - name: Run the smoke tier (fail fast)
        run: |
          set -o pipefail
          bunx playwright test --project=mobile-360 --project=desktop-1280 e2e/smoke-auth-i18n.spec.ts e2e/shell.spec.ts e2e/auth-signout.spec.ts 2>&1 | tee smoke.log
      # INC-081: the smoke tier used to upload nothing, so its failures never
      # reached docs/tracking/e2e-last-failure.md ("0 failed" while red).
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-smoke
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: test-results/results.json
          if-no-files-found: warn
          retention-days: 7
      # If Playwright never wrote results, the log tail is the only evidence.
      - name: Capture smoke log tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-smoke
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: smoke.log
          if-no-files-found: warn
          retention-days: 7
      # U2a / INC-083 rule 2: Playwright writes a page snapshot per failure at
      # test-results/<slug>/error-context.md — the only diagnosable evidence for
      # a timeout. The reporter quotes it, so it must travel out of the job.
      - name: Upload error contexts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-context-smoke
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: playwright-report/
          retention-days: 7

  # ── DEC-023-B — CHANGED-SPEC FAST LANE ────────────────────────────────────
  # SIGNAL ONLY. This job is a plan-gated substitute for the local authenticated
  # runs the executor cannot perform (no prod/staging secrets in its
  # environment): it re-runs just the spec files this branch touched so a spec
  # edit gets an authed verdict in minutes instead of a full matrix.
  # AUTHORITY IS UNCHANGED: the merged verdict job below `needs:` exactly the
  # full matrix (e2e-smoke, e2e-shard, e2e-email). This lane is never in that
  # needs list and can never turn a red matrix green — or a green matrix red.
  # Auto-retire: if executor-side staging secrets ever arrive (DEC-023), delete
  # this job; local runs then carry the same signal at zero CI cost.
  e2e-changed:
    name: E2E changed specs (fast lane)
    needs: e2e-preflight
    runs-on: ubuntu-latest
    # signal-only per DEC-023-B — surfaces in logs/report, never gates verdict or promote;
    # a lane-only failure with a green matrix is contention noise by definition
    continue-on-error: true
    env:
      E2E_SHARD: changed
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "1"
      E2E_FAKE_TRANSLATE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The changed set is computed against the merge-base with origin/main, so
      # it names what THIS branch touched, not what main moved on to.
      - name: Compute changed spec files
        id: changed
        run: |
          set -u
          git fetch --no-tags --depth=200 origin main || true
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -z "$base" ]; then
            echo "No merge-base with origin/main — skipping cleanly."
            echo "specs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=d "$base"...HEAD -- 'e2e/*.spec.ts' | tr '\n' ' ')"
          count="$(echo $files | wc -w)"
          if [ "$count" -eq 0 ]; then
            echo "No changed e2e specs — skipping cleanly."
            echo "specs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -gt 5 ]; then
            echo "$count changed specs (> cap 5) — the full matrix already covers this; skipping cleanly."
            echo "specs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed specs: $files"
          echo "specs=$files" >> "$GITHUB_OUTPUT"
      - name: Cache bun install
        if: steps.changed.outputs.specs != ''
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        if: steps.changed.outputs.specs != ''
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        if: steps.changed.outputs.specs != ''
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: steps.changed.outputs.specs != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.changed.outputs.specs != ''
        run: bunx playwright install --with-deps chromium
      - name: Build the app in E2E mode (VITE_E2E=1)
        if: steps.changed.outputs.specs != ''
        run: bun run build:e2e
      - name: Verify e2e build output
        if: steps.changed.outputs.specs != ''
        run: test -f dist/server/index.mjs || { echo "::error::e2e build did not emit dist/server/index.mjs — nitro target drift"; exit 1; }
      - name: Run the changed specs (both projects, one job)
        if: steps.changed.outputs.specs != ''
        run: |
          set -o pipefail
          bunx playwright test --project=mobile-360 --project=desktop-1280 --workers=2 ${{ steps.changed.outputs.specs }} 2>&1 | tee changed.log
      - name: Upload changed-lane results
        if: always() && steps.changed.outputs.specs != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-changed
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: test-results/results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Capture changed-lane log tail
        if: always() && steps.changed.outputs.specs != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-changed
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: changed.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload error contexts
        if: failure() && steps.changed.outputs.specs != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-context-changed
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    needs: e2e-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # INC-080: fixture ownership boundary. All shards share GITHUB_RUN_ID, so
      # the shard id is what makes each process's fixtures its own.
      E2E_SHARD: ${{ matrix.shard }}
      # DEC-024: shards run 2 workers — safe by construction under the
      # scratch-key identity law (run×shard×worker×project×test). REVERT RULE:
      # any cross-worker interference class returns this to "1" before the
      # class is even diagnosed. Smoke and email-serial stay serial by design.
      E2E_WORKERS: "2"
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      # DEC-018 — the suite runs against the BUILT app, with the test
      # instruments compiled in (src/lib/env-flags.ts). PROD is unaffected:
      # VITE_E2E is set here and by `bun run build:e2e` only.
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "1"
      # U4c — FAKE MODE: the /api/translate route skips Google entirely, so CI
      # needs no provider key and spends nothing. PROD is unaffected.
      E2E_FAKE_TRANSLATE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun cache hit?
        run: echo "bun cache-hit=${{ steps.bun-cache.outputs.cache-hit }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Playwright cache hit?
        run: echo "playwright cache-hit=${{ steps.pw-cache.outputs.cache-hit }}"
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # DEC-018: E2E runs the PRODUCTION build in E2E mode. Each job builds its
      # own dist/ (the build is seconds and needs the job's VITE_* env anyway);
      # artifact-sharing was not worth the plumbing.
      - name: Build the app in E2E mode (VITE_E2E=1)
        run: bun run build:e2e
      # INC-085e — the build step is not allowed to hand a missing artifact to
      # the serve step: ENOENT at the serve step is a symptom of a build-time
      # drift, and it cost six jobs once.
      # DEC-019/INC-088 — the e2e serve runtime is nitro's node-server, so the
      # artifact that must exist is the node entry, not wrangler.json.
      - name: Verify e2e build output
        run: test -f dist/server/index.mjs || { echo "::error::e2e build did not emit dist/server/index.mjs — nitro target drift"; echo "--- emitted tree ---"; find dist .output -maxdepth 3 -type f 2>/dev/null | head -60; exit 1; }
      - name: Run E2E shard (built app, served on node — DEC-018/DEC-019)
        run: |
          set -o pipefail
          bunx playwright test --project=mobile-360 --project=desktop-1280 --shard=${{ matrix.shard }}/4 2>&1 | tee ${{ matrix.shard }}.log
      - name: Capture shard log tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-${{ matrix.shard }}
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: ${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 7
      # Every shard uploads its JSON reporter output, pass or fail — the merged
      # report must see ALL failures, not only those of the first red shard.
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: test-results/results.json
          if-no-files-found: warn
          retention-days: 7
      # U2a / INC-083 rule 2: Playwright writes a page snapshot per failure at
      # test-results/<slug>/error-context.md — the only diagnosable evidence for
      # a timeout. The reporter quotes it, so it must travel out of the job.
      - name: Upload error contexts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-context-${{ matrix.shard }}
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: playwright-report/
          retention-days: 7

  e2e-email:
    # INC-082 — EMAIL QUOTA JOB. The Auth email/signup rate limit is per-project
    # and per-hour, so every email-sending spec runs here, in ONE process, and
    # never inside the shard matrix or the smoke tier.
    name: E2E email (serial, quota-bound)
    needs: e2e-preflight
    runs-on: ubuntu-latest
    env:
      E2E_SHARD: email
      E2E_EMAIL_SINK: ${{ vars.E2E_EMAIL_SINK }}
      E2E_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: https://jatpuhfdjfzctjipklmk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      # DEC-018 — the suite runs against the BUILT app, with the test
      # instruments compiled in (src/lib/env-flags.ts). PROD is unaffected:
      # VITE_E2E is set here and by `bun run build:e2e` only.
      VITE_E2E: "1"
      E2E_SERVE_BUILT: "1"
      # U4c — FAKE MODE: the /api/translate route skips Google entirely, so CI
      # needs no provider key and spends nothing. PROD is unaffected.
      E2E_FAKE_TRANSLATE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # DEC-018: E2E runs the PRODUCTION build in E2E mode. Each job builds its
      # own dist/ (the build is seconds and needs the job's VITE_* env anyway);
      # artifact-sharing was not worth the plumbing.
      - name: Build the app in E2E mode (VITE_E2E=1)
        run: bun run build:e2e
      # INC-085e — the build step is not allowed to hand a missing artifact to
      # the serve step: ENOENT at the serve step is a symptom of a build-time
      # drift, and it cost six jobs once.
      # DEC-019/INC-088 — the e2e serve runtime is nitro's node-server, so the
      # artifact that must exist is the node entry, not wrangler.json.
      - name: Verify e2e build output
        run: test -f dist/server/index.mjs || { echo "::error::e2e build did not emit dist/server/index.mjs — nitro target drift"; echo "--- emitted tree ---"; find dist .output -maxdepth 3 -type f 2>/dev/null | head -60; exit 1; }
      - name: Run the email-serial project (single instance)
        run: |
          set -o pipefail
          bunx playwright test --project=email-serial --workers=1 2>&1 | tee email.log
      - name: Upload email results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-email
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: test-results/results.json
          if-no-files-found: warn
          retention-days: 7
      # U2a / INC-083 rule 2: Playwright writes a page snapshot per failure at
      # test-results/<slug>/error-context.md — the only diagnosable evidence for
      # a timeout. The reporter quotes it, so it must travel out of the job.
      - name: Upload error contexts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-context-email
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
      - name: Capture email log tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-email
          # INC-100 — evidence artifacts are OVERWRITE-ON-RERUN: without this,
          # upload-artifact@v4 refuses a same-named artifact on attempt >= 2 and
          # the merged reporter reads attempt 1 or nothing at all.
          overwrite: true
          path: email.log
          if-no-files-found: warn
          retention-days: 7

  e2e:
    # HISTORICAL NAME PRESERVED: docs/tracking/ci-status.md lists one row per
    # job, and downstream reads key off this exact string. It is now the MERGED
    # verdict for the four shards.
    name: E2E (Playwright, ethio-staging)
    needs: [e2e-smoke, e2e-shard, e2e-email]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # INC-084e — DOWNLOAD RESILIENCE. actions/download-artifact@v4 FAILS the
      # step when a `pattern` matches nothing (e.g. every upstream job died
      # before uploading). A missing or partial artifact set must never kill
      # the job before the reporter runs: the reporter's whole purpose is to
      # describe exactly that situation.
      - name: Download shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-results-*
          path: shard-results
      # Log tails only exist for RED jobs; a run where every job wrote results
      # downloads nothing here and the step is a no-op.
      - name: Download job log tails
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-log-*
          path: shard-logs
      # Context files only exist for RED jobs; a green run downloads nothing.
      # LAYOUT (rehearsed in scripts/fixtures): with `pattern` and the default
      # merge-multiple:false, EACH artifact lands in its OWN subdirectory named
      # after the artifact — shard-contexts/e2e-context-smoke/test-results/<slug>/
      # error-context.md. The reporter walks for error-context.md by name, so
      # it handles that shape, the merged-flat shape and the empty directory.
      - name: Download error contexts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-context-*
          path: shard-contexts
      # MERGE MECHANISM: JSON concatenation, not `playwright merge-reports`.
      # The consumer is scripts/e2e-failure-report.ts, which reads the JSON
      # reporter shape; E2E_RESULTS_DIR makes it walk every shard's
      # results.json and sum stats across them.
      - name: Publish merged E2E report
        env:
          E2E_RESULTS_DIR: shard-results
          E2E_LOGS_DIR: shard-logs
          E2E_CONTEXT_DIR: shard-contexts
          # DEC-023-B: `changed?` is OPTIONAL — labelled like any source when the
          # fast lane ran, silently omitted when it skipped. The lane is signal
          # only; this job's `needs:` and E2E_GREEN stay the full matrix.
          E2E_EXPECTED_SOURCES: smoke,email,1,2,3,4,changed?

          E2E_GREEN: ${{ (needs.e2e-shard.result == 'success' && needs.e2e-smoke.result == 'success' && needs.e2e-email.result == 'success') && '1' || '0' }}
          E2E_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # INC-088 — platform-origin label: Lovable's auto-pushes carry a fixed
          # commit subject, and the reporter prefixes a PLATFORM-ORIGIN? hint
          # when it sees one. Empty on pull_request events, which is correct.
          E2E_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -u
          # The self-test runs FIRST: a reporter that only ever prints "no
          # failures" proves nothing. It never writes the live report, so a
          # self-test failure must not stop us from publishing one.
          selftest=0
          SELF_TEST=1 bun scripts/e2e-failure-report.ts || selftest=$?
          # NEVER-SILENT LAW (INC-084e): the reporter writes a file even when
          # it crashes (the file then names the crash), so a non-zero exit is
          # recorded and re-raised AFTER the file is committed — never allowed
          # to skip publication, which is exactly how ce7ec6c went unreported.
          reporter=0
          bun scripts/e2e-failure-report.ts || reporter=$?

          cp docs/tracking/e2e-last-failure.md /tmp/e2e-last-failure.md
          # Regenerate-after-fetch + retry, IDENTICAL to ci-status-report.yml:
          # the file is derived state owned by this run, so rewriting it on top
          # of whatever dev now holds can never conflict. A push failure is a
          # ::warning, never a red — bookkeeping must not redden Actions.
          # DEC-020: tracking commits land on DEV (main advances only via the
          # promote job); the `[skip ci]` tag keeps them from re-triggering CI.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin dev
            git reset --hard origin/dev
            mkdir -p docs/tracking
            cp /tmp/e2e-last-failure.md docs/tracking/e2e-last-failure.md
            git add docs/tracking/e2e-last-failure.md
            if git diff --cached --quiet; then
              echo "No report change; nothing to commit."
              pushed=1
              break
            fi
            git commit -m "ci: e2e failure report [skip ci]"
            if git push origin HEAD:dev; then
              pushed=1
              break
            fi
            echo "Report push rejected (attempt ${attempt}/3); refetching."
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::warning::E2E failure report push failed after retries"
          fi
          # The report is published; NOW the reporter's own health is raised.
          if [ "$selftest" -ne 0 ]; then
            echo "::error::E2E failure reporter self-test failed (exit ${selftest})"
            exit "$selftest"
          fi
          if [ "$reporter" -ne 0 ]; then
            echo "::error::E2E failure reporter crashed (exit ${reporter}) — see docs/tracking/e2e-last-failure.md"
            exit "$reporter"
          fi
          exit 0

      # Law F4 — the merged job's conclusion IS the E2E verdict. A red shard or
      # a red smoke tier reddens this row; bookkeeping never masks it.
      - name: Verdict
        run: |
          echo "smoke=${{ needs.e2e-smoke.result }} email=${{ needs.e2e-email.result }} shards=${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-smoke.result }}" != "success" ] || [ "${{ needs.e2e-shard.result }}" != "success" ] || [ "${{ needs.e2e-email.result }}" != "success" ]; then
            echo "::error::E2E failed — see docs/tracking/e2e-last-failure.md"
            exit 1
          fi
          echo "All E2E shards and the smoke tier passed."

  # DEC-020 — main advances ONLY here: a fast-forward from dev, solely on full
  # green. `needs:` enumerates EVERY job above, and `success()` is true only
  # when all of them succeeded (the merged `e2e` job has `if: always()`, so it
  # always reports a verdict; its own red already blocks promotion). Red never
  # lands on main; main is the certified-green record.
  promote:
    name: Promote to main (fast-forward on green)
    needs:
      [
        build-and-check,
        secrets-scan,
        migration-lint,
        string-scan,
        listing-write-seam,
        browse-path-guard,
        marketplace-weight,
        bundle-budget,
        dependency-audit,
        e2e-preflight,
        e2e-smoke,
        e2e-shard,
        e2e-email,
        e2e,
      ]
    if: github.ref == 'refs/heads/dev' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure the actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fast-forward guard (ff-only law — never merge/rebase here)
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "::error::MAIN DIVERGED — fast-forward impossible; manual reconcile per DEC-020 (ff-only law, never merge/rebase here); run the sync-main dispatch after confirming main's extra commits are tracking-only"; exit 1; }
      - name: Promote dev to main
        run: git push origin HEAD:main
